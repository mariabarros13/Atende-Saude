openapi: 3.1.0
info:
  title: Atende Saúde API
  version: 1.0.0
  description: >-
    API REST para autenticação e gerenciamento de solicitações de atendimento
    da saúde pública. A autenticação usa tokens pessoais do Laravel Sanctum
    enviados no cabeçalho Authorization como Bearer.

servers:
  - url: http://localhost:8000/api/v1
    description: Desenvolvimento local
  - url: https://atende-saude-api.onrender.com/api/v1
    description: Produção (atualizar após o deploy)

tags:
  - name: Autenticação
  - name: Solicitações
  - name: Sistema

paths:
  /login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário e cria um token de acesso
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@atendesaude.gov.br
              password: '12345678'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login realizado com sucesso.
                access_token: token-gerado-pelo-sanctum
                token_type: Bearer
                user:
                  id: 1
                  name: Administrador
                  email: admin@atendesaude.gov.br
        '422':
          description: Credenciais ausentes ou inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
              example:
                message: The given data was invalid.
                errors:
                  email:
                    - As credenciais fornecidas estão incorretas.

  /me:
    get:
      tags: [Autenticação]
      summary: Retorna o usuário autenticado
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados do usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /logout:
    post:
      tags: [Autenticação]
      summary: Revoga o token usado na solicitação
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Sessão encerrada com sucesso.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /solicitacoes:
    get:
      tags: [Solicitações]
      summary: Lista solicitações com filtros opcionais
      operationId: listSolicitacoes
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filtra pelo status atual
          schema:
            $ref: '#/components/schemas/Status'
        - name: categoria
          in: query
          description: Filtra pela categoria
          schema:
            $ref: '#/components/schemas/Categoria'
        - name: prioridade
          in: query
          description: Filtra pela prioridade
          schema:
            $ref: '#/components/schemas/Prioridade'
        - name: page
          in: query
          description: Número da página
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Página de solicitações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSolicitacoes'
              example:
                data:
                  - id: 7d9a6a20-9ff8-4a25-ae12-4cb53606af90
                    protocolo: ATD-2026-A1B2C
                    nome_solicitante: Maria Silva Santos
                    categoria: CONSULTA
                    prioridade: URGENTE
                    status: EM_ANALISE
                    descricao: Paciente com quadro grave de pneumonia bilateral necessitando internação hospitalar.
                    justificativa_prioridade: Quadro respiratório grave com necessidade de avaliação imediata.
                    created_at: '2026-09-22T12:30:00.000000Z'
                    updated_at: '2026-09-22T13:00:00.000000Z'
                links:
                  first: http://localhost:8000/api/v1/solicitacoes?page=1
                  last: http://localhost:8000/api/v1/solicitacoes?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  from: 1
                  last_page: 1
                  path: http://localhost:8000/api/v1/solicitacoes
                  per_page: 10
                  to: 1
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Solicitações]
      summary: Cria uma solicitação
      operationId: createSolicitacao
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarSolicitacaoRequest'
            examples:
              normal:
                summary: Solicitação de consulta
                value:
                  nome_solicitante: Maria Silva Santos
                  categoria: CONSULTA
                  prioridade: MEDIA
                  descricao: Paciente relata febre persistente e tosse há quatro dias.
              urgente:
                summary: Solicitação urgente com justificativa obrigatória
                value:
                  nome_solicitante: João Souza
                  categoria: CONSULTA
                  prioridade: URGENTE
                  descricao: Paciente com quadro grave de pneumonia bilateral necessitando internação hospitalar.
                  justificativa_prioridade: Quadro respiratório grave com necessidade de avaliação imediata.
      responses:
        '201':
          description: Solicitação criada. O status inicial é RECEBIDA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoResponse'
              example:
                data:
                  id: 7d9a6a20-9ff8-4a25-ae12-4cb53606af90
                  protocolo: ATD-2026-A1B2C
                  nome_solicitante: Maria Silva Santos
                  categoria: CONSULTA
                  prioridade: MEDIA
                  status: RECEBIDA
                  descricao: Paciente relata febre persistente e tosse há quatro dias.
                  justificativa_prioridade: null
                  created_at: '2026-09-22T12:30:00.000000Z'
                  updated_at: '2026-09-22T12:30:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /solicitacoes/{id}:
    get:
      tags: [Solicitações]
      summary: Busca uma solicitação pelo identificador
      operationId: getSolicitacao
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitacaoId'
      responses:
        '200':
          description: Solicitação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoResponse'
              example:
                data:
                  id: 7d9a6a20-9ff8-4a25-ae12-4cb53606af90
                  protocolo: ATD-2026-A1B2C
                  nome_solicitante: Maria Silva Santos
                  categoria: CONSULTA
                  prioridade: MEDIA
                  status: RECEBIDA
                  descricao: Paciente relata febre persistente e tosse há quatro dias.
                  justificativa_prioridade: null
                  created_at: '2026-09-22T12:30:00.000000Z'
                  updated_at: '2026-09-22T12:30:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /solicitacoes/{id}/status:
    patch:
      tags: [Solicitações]
      summary: Atualiza o status respeitando as transições permitidas
      description: |
        As transições permitidas são:

        - RECEBIDA → EM_ANALISE ou CANCELADA
        - EM_ANALISE → AGENDADA ou CANCELADA
        - AGENDADA → CONCLUIDA ou CANCELADA

        CONCLUIDA e CANCELADA são estados finais.
      operationId: updateSolicitacaoStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitacaoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarStatusRequest'
            example:
              status: EM_ANALISE
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoResponse'
              example:
                data:
                  id: 7d9a6a20-9ff8-4a25-ae12-4cb53606af90
                  protocolo: ATD-2026-A1B2C
                  nome_solicitante: Maria Silva Santos
                  categoria: CONSULTA
                  prioridade: MEDIA
                  status: EM_ANALISE
                  descricao: Paciente relata febre persistente e tosse há quatro dias.
                  justificativa_prioridade: null
                  created_at: '2026-09-22T12:30:00.000000Z'
                  updated_at: '2026-09-22T13:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '422':
          description: Status inválido no corpo da solicitação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The given data was invalid.
                errors:
                  status:
                    - The selected status is invalid.

  /up:
    get:
      tags: [Sistema]
      summary: Verifica a saúde da aplicação
      description: |
        Rota de saúde registrada pelo Laravel. Envie Accept: application/json
        para receber o corpo JSON documentado abaixo.
      servers:
        - url: http://localhost:8000/api/v1
          description: Desenvolvimento local

        - url: https://atende-saude-api.onrender.com/api/v1
          description: Produção
      responses:
        '200':
          description: Aplicação operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: up
        '500':
          description: Aplicação indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: down
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: personal access token (Laravel Sanctum)

  parameters:
    SolicitacaoId:
      name: id
      in: path
      required: true
      description: Identificador UUID da solicitação
      schema:
        type: string
        format: uuid

  responses:
    Unauthenticated:
      description: Token ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthenticated.
    ValidationError:
      description: Os dados enviados não passaram pela validação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
          example:
            message: The given data was invalid.
            errors:
              justificativa_prioridade:
                - A justificativa é obrigatória para solicitações urgentes.
    NotFound:
      description: Solicitação não encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Solicitação não encontrada.
    ConflictResponse:
      description: Conflito de regra de negócio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Transição de status não permitida.

  schemas:
    Status:
      type: string
      enum: [RECEBIDA, EM_ANALISE, AGENDADA, CONCLUIDA, CANCELADA]
    Categoria:
      type: string
      enum: [CONSULTA, EXAME, VACINACAO, OUTRO]
    Prioridade:
      type: string
      enum: [BAIXA, MEDIA, ALTA, URGENTE]
    Solicitacao:
      type: object
      required: [id, protocolo, nome_solicitante, categoria, prioridade, status, descricao, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        protocolo:
          type: string
          example: ATD-2026-A1B2C
        nome_solicitante:
          type: string
        categoria:
          $ref: '#/components/schemas/Categoria'
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        status:
          $ref: '#/components/schemas/Status'
        descricao:
          type: string
        justificativa_prioridade:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SolicitacaoResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Solicitacao'
    PaginatedSolicitacoes:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Solicitacao'
        links:
          type: object
          properties:
            first: { type: [string, 'null'] }
            last: { type: [string, 'null'] }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: [integer, 'null'] }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer, example: 10 }
            to: { type: [integer, 'null'] }
            total: { type: integer }
    CriarSolicitacaoRequest:
      type: object
      required: [nome_solicitante, categoria, prioridade, descricao]
      properties:
        nome_solicitante:
          type: string
          maxLength: 255
        categoria:
          $ref: '#/components/schemas/Categoria'
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        descricao:
          type: string
        justificativa_prioridade:
          type: [string, 'null']
          description: Obrigatória quando prioridade for URGENTE.
    AtualizarStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/Status'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [message, access_token, token_type, user]
      properties:
        message:
          type: string
        access_token:
          type: string
          description: Token pessoal do Laravel Sanctum.
        token_type:
          type: string
          const: Bearer
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ValidationErrorBody:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
